name: Log CLV Predictions

# Freezes a line-movement prediction for every upcoming game so closing line
# value is captured automatically. Safe to run daily: line_predictions has a
# UNIQUE(game_id) constraint, so each game is captured once — the first time it
# enters the 10-day weekly window — and skipped thereafter. That is exactly the
# "hold the opening number" behaviour CLV measurement requires.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL Season year (e.g. 2026)'
        required: false
        default: ''
      week:
        description: 'NFL Week number (blank = auto-detect)'
        required: false
        default: ''
  schedule:
    # Every 3 hours. This used to run once daily, which was actively costly:
    # a pick is worth ~+1.55 CLV inside the first 6 hours and roughly nothing
    # after 3 days (see scripts/screen_bet_timing.py), so a board that posted
    # just after a daily run could be up to 24h stale before it was ever
    # visible — most of the edge, gone before anyone saw the bet.
    #
    # refresh-odds already runs every 15 min during game week, so the logger
    # was the bottleneck. At 3h the frozen number is at worst 3 hours behind
    # the true opener, comfortably inside the best bucket.
    - cron: '30 */3 * * *'

jobs:
  log-clv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        # requests is appended rather than added to requirements-ci.txt, whose
        # hash is the pip cache key for every workflow here. score_week imports
        # it transitively via fetch_historical_weather for stadium coordinates,
        # and without it _stadium_coords swallowed the ImportError and served
        # away_travel_miles = 0 on every CI-logged prediction.
        run: pip install -r requirements-ci.txt requests

      - name: Download models from Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/download_models.py

      - name: Fetch public betting splits
        # Best effort, and in practice it will always skip here: Action Network
        # returns nothing to a datacenter IP. Kept so the step exists if that
        # ever changes; real collection runs from a home machine.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_nfl_splits.py

      - name: Log CLV predictions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python scripts/log_clv_predictions.py ${{ github.event.inputs.season }} ${{ github.event.inputs.week }}
