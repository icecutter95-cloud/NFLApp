name: Collect Betting Splits

# Public betting splits for both leagues, in CI.
#
# This ran on a Windows scheduled task until 2026-10-07 because
# action_splits.py warned that Action Network "is NOT runnable on GitHub
# Actions". That was measured, but only for the public-betting PAGE, and the
# warning did not say so. Re-measured from a runner on 2026-10-07 (see the
# Probe Action Egress workflow and scripts/probe_action_egress.py): the page
# still returns no __NEXT_DATA__, while the scoreboard API returns 30 NFL and
# 116 college markets with real percentages -- the same values as a home
# connection, TB@DAL spread 35/65 money 42/58 from both. Both fetchers now use
# the API path, so both run here.
#
# collect_splits.bat still works and is kept as a fallback: if Action Network
# ever starts blocking GitHub's ranges too, that task is the way back in with
# no code change.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (blank = whatever the logger is freezing)'
        required: false
        default: ''
  schedule:
    # Every 2 hours. Splits are only interesting next to the line that was live
    # beside them, and captured_at is floored to the minute so repeat fetches
    # inside one CDN window collapse onto a single row rather than
    # double-counting an observation. Offset to :50 to stay clear of the hourly
    # refresh-odds pg_cron at :00 and the TD props capture at :15.
    - cron: '50 */2 * * *'

jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt requests

      - name: NFL splits
        # Independent of the college step: one league's markets being down must
        # not cost the other its capture.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python scripts/fetch_nfl_splits.py --week ${{ github.event.inputs.week }}
          else
            python scripts/fetch_nfl_splits.py --next-weeks
          fi

      - name: College splits
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_cfb_splits.py
