name: Collect Betting Splits

# Public betting splits for both leagues, in CI.
#
# This ran on a Windows scheduled task until 2026-10-07 because
# action_splits.py warned that Action Network "is NOT runnable on GitHub
# Actions". That was measured, but only for the public-betting PAGE, and the
# warning did not say so. Re-measured from a runner on 2026-10-07 (see the
# Probe Action Egress workflow and scripts/probe_action_egress.py): the page
# still returns no __NEXT_DATA__, while the scoreboard API returns 30 NFL and
# 116 college markets with real percentages -- the same values as a home
# connection, TB@DAL spread 35/65 money 42/58 from both. Both fetchers now use
# the API path, so both run here.
#
# collect_splits.bat still works and is kept as a fallback: if Action Network
# ever starts blocking GitHub's ranges too, that task is the way back in with
# no code change.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week (blank = whatever the logger is freezing)'
        required: false
        default: ''
  schedule:
    # Asks for every 2 hours; GitHub delivers about 3 runs a day (48 of 168
    # scheduled runs over the 14 days to 2026-11-19, 29%), which is why
    # nfl_gate_readings gets 2-3 readings a day rather than 12. Raising this
    # number does not help -- see .github/workflows/README.md.
    #
    # Splits are only interesting next to the line that was live
    # beside them, and captured_at is floored to the minute so repeat fetches
    # inside one CDN window collapse onto a single row rather than
    # double-counting an observation. Offset to :50 to stay clear of the hourly
    # refresh-odds pg_cron at :00 and the TD props capture at :15.
    - cron: '50 */2 * * *'

jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt requests

      - name: NFL splits
        # Independent of the college step: one league's markets being down must
        # not cost the other its capture.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python scripts/fetch_nfl_splits.py --week ${{ github.event.inputs.week }}
          else
            python scripts/fetch_nfl_splits.py --next-weeks
          fi

      - name: College lines
        # SECOND line pull, deliberately duplicating log-cfb.yml's "Fetch
        # current CFB odds". Measured 2026-11-20 over 4 days: CFB splits got 34
        # captures and CFB lines only 11, because fetch_cfb_splits.py runs in
        # three places and fetch_cfb_odds.py ran in exactly one. The result was
        # a line up to 4h older than the tickets beside it -- on 11-20 the
        # WYOMING/NEW_MEXICO spread sat at a 4-day-old 7.5 while the 16:00
        # splits capture carried 9.0, which is the difference between a +3.0
        # and a +1.5 reading of rule 1 on a 1.5-point bar.
        #
        # Raising the cron does NOT fix that -- see README.md, GitHub delivers
        # ~a third of scheduled runs whatever the interval. Adding the pull to
        # this workflow does, because the two workflows fire in independent
        # scheduler waves. It also puts the line pull in the SAME RUN as the
        # splits below, so line and tickets land seconds apart, not hours.
        #
        # cfb_line_history is append-only (surrogate pkey, recorded_at defaults
        # to now()), so a second pull can never overwrite an opener or conflict
        # with log-cfb's row. Cost is 2 Odds API credits per call.
        #
        # continue-on-error, UNLIKE log-cfb.yml, where this step failing should
        # stop the run because the predictions after it would be meaningless.
        # Here it is a secondary capture and the gate readings come after it; a
        # failed odds pull must not cost the NFL half its reading.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_cfb_odds.py

      - name: College splits
        # ALSO RUNS in log-cfb.yml -- fetch_cfb_splits.py is deliberately
        # left in both workflows. The two fire in independent GitHub
        # scheduler waves, so CFB splits get ~6 captures a day instead of ~3.
        # That redundancy started as an accident and is now load-bearing:
        # merging these workflows would quietly drop it. See
        # .github/workflows/README.md.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_cfb_splits.py

      - name: NFL gate readings
        # Runs AFTER the NFL splits step, because rule 2 reads the splits this
        # workflow just captured. Writes one row per upcoming qualifying
        # market into nfl_gate_readings; see scripts/log_gate_readings.py.
        #
        # Deliberately NOT continue-on-error. The two splits steps tolerate
        # failure so one league cannot cost the other its capture, and that
        # tolerance is also why CFB collection died silently for five days in
        # October. This step is last, so failing loudly costs nothing already
        # captured and is the only way a broken reading becomes visible.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/log_gate_readings.py
