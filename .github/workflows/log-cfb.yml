name: Log CFB Predictions

# College football: pull the current board and freeze a prediction per game.
#
# Separate workflow from log-clv.yml on purpose. That job feeds line_history ->
# line_open_close -> clv_tracking, which is where every validated NFL number
# comes from. Keeping college on its own path means a CFBD outage or a crosswalk
# gap can never take down the one market with a demonstrated edge.
#
# Asks for every 3 hours, matching the NFL cadence and for the same reason: a
# pick is worth ~+1.55 CLV in its first six hours and roughly nothing after
# three days, so a board that posts just after a run must not sit unlogged for
# long.
#
# IT DOES NOT RUN EVERY 3 HOURS. Measured 2026-11-19: 43 of 112 scheduled runs
# over 14 days (38%), and cfb_line_history snapshot gaps average 8.3h with a
# max of 12h -- not one gap in those 14 days honoured the 3h asked for here.
# So the goal stated above is NOT being met: a board CAN sit unlogged for
# longer than the 6h window that is the whole reason for the cadence. Whether
# that is actually eating CFB opener value is UNMEASURED -- the obvious probe
# is confounded, see the open question in .github/workflows/README.md. Raising
# the cron will not help; read that file first.
#
# Predictions are frozen on first sight — cfb_predictions is keyed on
# (game_id, bet_type) — so re-running is harmless.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 */3 * * *'

jobs:
  log-cfb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        # `requests` is appended here rather than added to requirements-ci.txt
        # because that file's hash is the pip cache key for the NFL workflows.
        # Editing it would force a cold resolve of unpinned packages (nfl-data-py,
        # pandas, xgboost) in the pipeline that produces every validated number we
        # have. The CFB fetchers call CFBD and the Odds API with requests directly;
        # the NFL path goes through the supabase client, which is why this only
        # surfaced now.
        run: pip install -r requirements-ci.txt requests

      - name: Download models from Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/download_models.py

      - name: Fetch current CFB odds
        # ALSO RUNS in collect-splits.yml as "College lines", added
        # 2026-11-20 so the line is captured in the same run as the splits
        # rather than up to 4h earlier. Both are kept: the two workflows
        # fire in independent scheduler waves, which is the only thing that
        # actually raises the capture rate. See .github/workflows/README.md.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_cfb_odds.py

      - name: Fetch public betting splits
        # ALSO RUNS in collect-splits.yml -- fetch_cfb_splits.py is deliberately
        # left in both workflows. The two fire in independent GitHub
        # scheduler waves, so CFB splits get ~6 captures a day instead of ~3.
        # That redundancy started as an accident and is now load-bearing:
        # merging these workflows would quietly drop it. See
        # .github/workflows/README.md.
        #
        # Best effort. Action Network is a third-party page, not a contracted
        # feed -- if its markup changes or a datacenter IP gets refused, the
        # board and the grading still matter more than the splits do.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_cfb_splits.py

      - name: Grade finished college games
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_cfb_results.py

      - name: Log CFB predictions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/log_cfb_predictions.py
