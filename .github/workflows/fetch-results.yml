name: Fetch Game Results

# Loads final scores into game_results, which is what turns the frozen
# predictions in line_predictions into graded win/loss rows. Without this the
# CLV view can only ever show closing line value, never a record.
#
# Runs Tuesday 13:00 UTC — after Monday night finishes and after nflverse has
# posted the final box scores. Upserts on game_id, so re-running is harmless
# and a missed week is picked up automatically the next time it fires.

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'NFL Season year (blank = current)'
        required: false
        default: ''
  schedule:
    - cron: '0 13 * * 2'

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        # requests is appended rather than added to requirements-ci.txt, whose
        # hash is the pip cache key for every workflow here. score_week imports
        # it transitively via fetch_historical_weather for stadium coordinates,
        # and without it _stadium_coords swallowed the ImportError and served
        # away_travel_miles = 0 on every CI-logged prediction.
        run: pip install -r requirements-ci.txt requests

      - name: Fetch game results
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/fetch_game_results.py ${{ github.event.inputs.season }}
