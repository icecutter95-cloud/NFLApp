name: Probe Action Egress

# Measures whether Action Network answers a GitHub Actions runner, and with
# real percentages rather than (0, 0) placeholders.
#
# action_splits.py has carried a measured warning since 2026-09-06 that the
# public-betting PAGE returns no __NEXT_DATA__ to a runner, and the whole
# splits pipeline was moved to a scheduled task on a home machine on that
# basis. A separate project reports the API path works from Vercel, and it is
# verified working from Supabase's egress. This answers the same question for
# GitHub, so the decision is measured here rather than inferred from there.
#
# Dispatch only. Delete once the answer is recorded in action_splits.py.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL week to request from the API path'
        required: false
        default: '5'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt requests

      - name: Probe
        # Must not fail the run: "no usable splits" IS the result we are
        # measuring, and the log is the output that matters.
        continue-on-error: true
        run: python scripts/probe_action_egress.py --week ${{ github.event.inputs.week || '5' }}
